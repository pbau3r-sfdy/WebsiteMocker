name: Bug Report
description: Something on the live site is broken.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: url
    attributes:
      label: URL where it happens
      placeholder: "https://{{DOMAIN}}/..."
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Desktop
        - Mobile
        - Tablet
        - Not sure
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser (optional)
      placeholder: "Chrome 141, Safari 18"
    validations:
      required: false
