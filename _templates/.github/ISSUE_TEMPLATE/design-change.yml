name: Design or Page Change
description: Request a visual change, a layout change, a new page, or a wording change on an existing page.
title: "[Design] "
labels: ["design-change"]
body:
  - type: dropdown
    id: change-type
    attributes:
      label: Type of change
      options:
        - Wording on an existing page
        - "Colours / fonts / spacing"
        - Layout of an existing page
        - Brand-new page
        - Navigation or menu
        - Other
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Which page?
      placeholder: "/about"
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: What it looks like now
    validations:
      required: true

  - type: textarea
    id: desired
    attributes:
      label: What it should look like instead
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: Screenshots or reference links (optional)
    validations:
      required: false
