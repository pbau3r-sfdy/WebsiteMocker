name: Deploy WebsiteMocker to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Switched from workflow-based Pages deployment (deploy-pages@v4, CDN-activation wait)
# to branch-based deployment (JamesIves action, git-push to gh-pages — no wait, < 60s).
# Repo Pages source: gh-pages branch / root  (changed via API 2026-08-06)
permissions:
  contents: write   # required to push to gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build all sites
        # Skip experiment/duplicate sites that are large but not needed in sandbox
        run: node _scripts/build-all.js
        env:
          SKIP_SITES: levion-orbint-style

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist        # built output from build-all.js
          branch: gh-pages    # GitHub Pages source branch
          clean: true         # remove files in branch not present in dist/
          single-commit: true # squash history to keep gh-pages branch lean
