name: Deploy WebsiteMocker to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Branch-based deployment via JamesIves/github-pages-deploy-action.
# Pages source: gh-pages branch / root  (set 2026-08-06 via GitHub API).
# This replaces the old workflow-mode deploy (deploy-pages@v4) which had a
# hardcoded 10-minute CDN-activation cap that caused every push to time out.
permissions:
  contents: write   # push to gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22 (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: '22'   # pinned LTS major — not floating lts/*
          cache: npm

      - name: Install dependencies (ci — lockfile-exact)
        # npm ci is deterministic: uses package-lock.json exactly, errors on drift,
        # and never writes back to the lockfile. Faster than npm install in CI.
        run: npm ci --no-fund --no-audit

      - name: Build all sites
        # Experiment / WIP sites self-declare skip_ci:true in their wiring.json.
        # The build script reads that flag and skips them automatically.
        # SKIP_SITES env var is an emergency override for sites that lack wiring.json.
        run: node _scripts/build-all.js
        env:
          # Fallback skip list — prefer wiring.json skip_ci:true on each site instead.
          SKIP_SITES: ''

      - name: Deploy to GitHub Pages (gh-pages branch)
        # Branch-push deploy: no CDN activation polling, completes in < 30 seconds.
        # Requires .nojekyll in public/ so GitHub Pages skips Jekyll and serves
        # _astro/ CSS/JS directories without stripping them.
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          folder: dist        # root-level dist/ produced by build-all.js
          branch: gh-pages
          clean: true         # remove stale files from previous deploys
          single-commit: true # squash gh-pages history (keeps branch lean)
