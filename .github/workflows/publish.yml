name: Publish to Production

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Site slug to publish (e.g. sfdy)'
        required: true
        type: string

# No permissions block — the WM_PUBLISH_PAT provides access, not GITHUB_TOKEN.

concurrency:
  group: publish-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # PAT required so the commit-back git push in the final step succeeds.
          # GITHUB_TOKEN cannot push back to the WebsiteMocker repo's main branch.
          token: ${{ secrets.WM_PUBLISH_PAT }}
          # CR-02: persist-credentials must be false so the PAT remote URL set later
          # (git remote set-url origin https://x-access-token:PAT@...) is not silently
          # overridden by credentials stored in the git config by actions/checkout.
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Read and validate wiring.json
        id: wiring
        run: |
          node -e "
            const fs = require('fs');
            const slug = process.env.SLUG;
            if (!/^[a-z0-9-]+$/.test(slug)) {
              console.error('Error: slug must match ^[a-z0-9-]+\$');
              process.exit(1);
            }
            const path = 'sites/' + slug + '/wiring.json';
            let w;
            try { w = JSON.parse(fs.readFileSync(path, 'utf-8')); }
            catch(e) { console.error('Error: cannot read ' + path); process.exit(1); }
            if (w.stage < 5)   { console.error('Error: stage ' + w.stage + ' < 5 — site not production-ready'); process.exit(1); }
            if (!w.domain)     { console.error('Error: domain missing in wiring.json'); process.exit(1); }
            if (!w.prod_repo)  { console.error('Error: prod_repo missing in wiring.json'); process.exit(1); }
            // WR-04: strip any newlines from values before writing to GITHUB_OUTPUT
            const domain = w.domain.replace(/[\r\n]/g, '');
            const prod_repo = w.prod_repo.replace(/[\r\n]/g, '');
            const drops_enabled = (w.drops && w.drops.enabled === true) ? 'true' : 'false';
            const out = 'domain=' + domain + '\nprod_repo=' + prod_repo + '\ndrops_enabled=' + drops_enabled;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, out + '\n');
            console.log('Validated: stage=' + w.stage + ' domain=' + w.domain + ' prod_repo=' + w.prod_repo);
          "
        env:
          SLUG: ${{ inputs.slug }}

      - name: Analytics privacy gate (ANLY-06)
        # WR-01: slug is passed via env var, not interpolated into the shell string
        run: node _scripts/check-analytics-gate.mjs "$SLUG" --live
        env:
          SLUG: ${{ inputs.slug }}

      # ---- Open Drops (Phase 11) ------------------------------------------------
      # The private drops repo and its checks exist in THIS workflow only. deploy.yml
      # must never reference drops or the PAT (D-09). Drops logs print counts and
      # 4-char id prefixes only; the public Actions log must never carry a full id.
      - name: Checkout private drops
        if: steps.wiring.outputs.drops_enabled == 'true'
        # Private repo (D-01, D-02). A failure here must fail the publish loudly, so a
        # lapsed token never publishes zero drops and thereby unpublishes live ones.
        uses: actions/checkout@v7
        with:
          repository: pbau3r-sfdy/drops
          token: ${{ secrets.WM_PUBLISH_PAT }}
          path: _drops
          persist-credentials: false
          fetch-depth: 1

      - name: Install qpdf
        if: steps.wiring.outputs.drops_enabled == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y qpdf && qpdf --version

      - name: Drops check (CI)
        if: steps.wiring.outputs.drops_enabled == 'true'
        # Output is counts and 4-char prefixes only; --emit-masks makes GitHub redact
        # the ids from every later log line. GITHUB_TOKEN authenticates the public
        # gh-pages listing call (rate limits); a 403/429 there is only a WARN here.
        run: node _scripts/drop.mjs check "$SLUG" --ci --live --emit-masks
        env:
          SLUG: ${{ inputs.slug }}
          DROPS_DIR: ${{ github.workspace }}/_drops
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build site
        # WR-01: slug is passed via env var, not interpolated into the shell string
        # Astro prints route paths that contain the drop id; the public Actions log
        # must not, so the build output is filtered (32-hex ids become <id>).
        shell: bash
        run: |
          set -o pipefail
          node _scripts/build-single.mjs "$SLUG" 2>&1 | sed -E 's/[0-9a-f]{32}/<id>/g'
        env:
          SLUG: ${{ inputs.slug }}
          SITE_URL: https://${{ steps.wiring.outputs.domain }}
          SITE_BASE: /
          DROPS_DIR: ${{ steps.wiring.outputs.drops_enabled == 'true' && format('{0}/_drops', github.workspace) || '' }}
          DROPS_REQUIRE: ${{ steps.wiring.outputs.drops_enabled == 'true' && '1' || '' }}

      - name: Inject CNAME
        # WR-01: use env vars, not raw expression interpolation in shell strings
        run: echo "$DOMAIN" > "dist/$SLUG/CNAME"
        env:
          SLUG: ${{ inputs.slug }}
          DOMAIN: ${{ steps.wiring.outputs.domain }}

      - name: Swap robots.txt to Allow
        run: |
          printf 'User-agent: *\nAllow: /\n' > "dist/$SLUG/robots.txt"
        env:
          SLUG: ${{ inputs.slug }}

      - name: Push to production gh-pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          token: ${{ secrets.WM_PUBLISH_PAT }}
          repository-name: ${{ steps.wiring.outputs.prod_repo }}
          folder: dist/${{ inputs.slug }}   # inputs.slug is safe — validated as ^[a-z0-9-]+$ above
          branch: gh-pages
          clean: true
          single-commit: true

      - name: Update wiring.json stage 6
        run: |
          node -e "
            const fs = require('fs');
            const slug = process.env.SLUG;
            const path = 'sites/' + slug + '/wiring.json';
            const w = JSON.parse(fs.readFileSync(path, 'utf-8'));
            w.stage = 6;
            w.last_deploy = new Date().toISOString().slice(0, 10);
            fs.writeFileSync(path, JSON.stringify(w, null, 2) + '\n');
          "
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Reset origin back to WebsiteMocker — JamesIves rewrites it to the production repo
          git remote set-url origin "https://x-access-token:${{ secrets.WM_PUBLISH_PAT }}@github.com/${{ github.repository }}.git"
          git add sites/${{ inputs.slug }}/wiring.json
          git commit -m "chore(${{ inputs.slug }}): mark stage 6, live" || echo "No changes to commit"
          git push origin main
        env:
          SLUG: ${{ inputs.slug }}
