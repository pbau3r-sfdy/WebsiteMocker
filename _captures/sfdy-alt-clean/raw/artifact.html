<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Site</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap">
  <style>
    :root {
      --bg: #ffffff;
      --accent: #ff0000;
      --text: #111111;
    }
    * { box-sizing: border-box; margin: 0; }
    body { background: var(--bg); color: var(--text); }
    .hero { min-height: 80vh; display: flex; align-items: center; padding: 4rem 2rem; }
    .hero h1 { font-size: 3rem; color: var(--accent); }
    .hero img { width: 100%; object-fit: cover; }
    .nav { position: sticky; top: 0; background: #000; padding: 1rem 2rem; }
    .footer { padding: 2rem; background: #111; color: #fff; }
  </style>
</head>
<body>
  <nav class="nav">Nav Content</nav>
  <section class="hero" id="hero">
    <h1>Test Headline</h1>
    <img src="/images/hero.jpg" alt="Hero image">
  </section>
  <footer class="footer">Footer Content</footer>
</body>
</html>
